<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UI - Universal Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🧠</div>
            </div>
            <h1>UI - Universal Intelligence</h1>
            <p class="username">@ui_shop_bot</p>
        </div>

        <div class="menu">
            <div class="menu-item" data-page="subscriptions">
                <span class="icon"></span>
                <span class="text">Мои подписки</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="catalog">
                <span class="icon">️</span>
                <span class="text">Каталог</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="history">
                <span class="icon">🕐</span>
                <span class="text">История</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="tutorials">
                <span class="icon">📝</span>
                <span class="text">Туториалы</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="referral">
                <span class="icon">🔗</span>
                <span class="text">Реф-система</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="news">
                <span class="icon">🔔</span>
                <span class="text">Новости</span>
                <span class="arrow">›</span>
            </div>

            <div class="menu-item" data-page="support">
                <span class="icon"></span>
                <span class="text">Тех-поддержка</span>
                <span class="arrow">›</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
