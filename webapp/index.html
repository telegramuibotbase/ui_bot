<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0e1621;
            color: white;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .logo {
            width: 80px; height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .username { color: #8b949e; font-size: 14px; }
        .tabs {
            display: flex; gap: 8px;
            background: #17212b;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1; padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #8b949e;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .page { display: none; }
        .page.active { display: block; }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .category-card {
            background: #17212b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #242f3d;
            transition: all 0.2s;
        }
        .category-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }
        .category-icon { font-size: 32px; margin-bottom: 8px; }
        .category-name { font-size: 14px; font-weight: 600; }
        .category-count { font-size: 12px; color: #8b949e; margin-top: 4px; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo">🧠</div>
        <h1>UI - Universal Intelligence</h1>
        <p class="username" id="username">@user</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="showTab('catalog')">Каталог</div>
        <div class="tab" onclick="showTab('cart')">Корзина</div>
        <div class="tab" onclick="showTab('subs')">Подписки</div>
        <div class="tab" onclick="showTab('profile')">Профиль</div>
    </div>

    <div class="page active" id="page-catalog">
        <div class="categories">
            <div class="category-card">
                <div class="category-icon">💻</div>
                <div class="category-name">Софт</div>
                <div class="category-count">3 товара</div>
            </div>
            <div class="category-card">
                <div class="category-icon">👤</div>
                <div class="category-name">Аккаунты</div>
                <div class="category-count">2 товара</div>
            </div>
            <div class="category-card">
                <div class="category-icon">📚</div>
                <div class="category-name">Курсы</div>
                <div class="category-count">2 товара</div>
            </div>
            <div class="category-card">
                <div class="category-icon">⭐</div>
                <div class="category-name">Подписки</div>
                <div class="category-count">3 товара</div>
            </div>
        </div>
    </div>

    <div class="page" id="page-cart">
        <h2>🛒 Корзина</h2>
        <p style="color: #8b949e; margin-top: 20px;">Корзина пуста</p>
    </div>

    <div class="page" id="page-subs">
        <h2>💎 Подписки</h2>
        <p style="color: #8b949e; margin-top: 20px;">Нет активных подписок</p>
    </div>

    <div class="page" id="page-profile">
        <h2>👤 Профиль</h2>
        <p style="color: #8b949e; margin-top: 20px;">Загрузка...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('username').textContent = '@' + (user.username || 'user');
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('page-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
