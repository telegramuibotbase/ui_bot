<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UI - Universal Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🧠</div>
            </div>
            <h1>UI - Universal Intelligence</h1>
            <p class="username" id="username">@user</p>
        </header>

        <!-- Навигация (табы) -->
        <nav class="tabs">
            <div class="tab active" data-tab="catalog">🛍️ Каталог</div>
            <div class="tab" data-tab="cart">🛒 Корзина</div>
            <div class="tab" data-tab="subs"> Подписки</div>
            <div class="tab" data-tab="profile"> Профиль</div>
        </nav>

        <!-- Контент -->
        <main class="content">
            <!-- Каталог -->
            <section class="page active" id="page-catalog">
                <div class="categories" id="categories-list"></div>
                <div class="products" id="products-list" style="display: none;"></div>
            </section>

            <!-- Корзина -->
            <section class="page" id="page-cart">
                <h2>🛒 Корзина</h2>
                <div id="cart-items"></div>
                <div class="cart-total" id="cart-total" style="display: none;">
                    <div class="total-text">Итого: <span id="total-sum">0</span> ₽</div>
                    <button class="btn-primary" id="checkout-btn">Оформить заказ</button>
                </div>
                <div class="empty-state" id="cart-empty">
                    <div class="empty-icon">🛒</div>
                    <p>Корзина пуста</p>
                </div>
            </section>

            <!-- Подписки -->
            <section class="page" id="page-subs">
                <h2>💎 Мои подписки</h2>
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <p>У тебя пока нет активных подписок</p>
                    <p class="hint">Купи товар в каталоге, чтобы получить подписку</p>
                </div>
            </section>

            <!-- Профиль -->
            <section class="page" id="page-profile">
                <h2>👤 Профиль</h2>
                <div class="profile-info">
                    <div class="profile-row">
                        <span class="label">Имя:</span>
                        <span class="value" id="profile-name">—</span>
                    </div>
                    <div class="profile-row">
                        <span class="label">Username:</span>
                        <span class="value" id="profile-username">—</span>
                    </div>
                    <div class="profile-row">
                        <span class="label">ID:</span>
                        <span class="value" id="profile-id">—</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Модальное окно товара -->
        <div class="modal" id="product-modal">
            <div class="modal-content">
                <button class="modal-close" id="modal-close">✕</button>
                <div class="modal-icon" id="modal-icon"></div>
                <h2 id="modal-title"></h2>
                <p class="modal-category" id="modal-category"></p>
                <p class="modal-desc" id="modal-desc"></p>
                <div class="modal-price" id="modal-price"></div>
                <button class="btn-primary" id="modal-buy">🛒 Добавить в корзину</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
